StylesPath = styles

Vocab = fly-terms

MinAlertLevel = suggestion

SkippedScopes = script

# Only Fly's own style and Vale's built-in rules. The Google, proselint and
# write-good packages are gone: nearly all of their rules were already off,
# and the rest flagged things nobody acted on. With no packages there is
# nothing for `vale sync` to fetch, so the workflow skips it.
#
# What runs: Fly.WordList, the house vocabulary, and Vale.Repetition, which
# catches doubled words.

[*.{md,mdx,markerb}]
BasedOnStyles = Fly, Vale

Fly.Exclamation = NO
Fly.Headings = NO
Fly.Latin = NO
Fly.Machine = NO
Fly.OxfordComma = NO
Fly.SentenceLength = NO
Fly.Spelling = NO # off for good: covering MDX pages meant vetting 369 terms, then maintaining the list
Fly.Us = NO

Vale.Avoid = NO # its one reject-list entry, healthcheck, is already in Fly.WordList
Vale.Repetition = warning # error by default, which shows a doubled word as a red annotation
Vale.Spelling = NO # Fly.Spelling would replace it, and that's off
Vale.Terms = NO # enforces vocab-term casing even inside code, and prints raw regex vocab entries as suggested fixes

# Generated in other repos, so a suggestion here can't be acted on in this
# one: flyctl/cmd comes from superfly/flyctl, models.mdx from the Machines spec.
[flyctl/cmd/*.mdx]
BasedOnStyles =

[api/machines/models.mdx]
BasedOnStyles =

[formats]
markerb = md # maps our markerb file extension to md for linting
mdx = md # Mintlify pages are MDX; parse them as Markdown
