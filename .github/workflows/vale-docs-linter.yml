name: Check docs with Vale linter

on: [pull_request]

jobs:
  vale:
    name: Vale linter
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: get changed files
        id: changed-files

        uses: tj-actions/changed-files@v46.0.5
        with:
          fetch_depth: 2

        # run reviewdog and the linter
      - name: run reviewdog and linter
        uses: errata-ai/vale-action@reviewdog
        with:
          debug: true
          files: ${{ steps.changed-files.outputs.all_changed_and_modified_files }}
          separator: ","
          # added, diff_context, file, nofilter
          filter_mode: file
          # github-pr-check, github-pr-review, github-check
          reporter: github-pr-check
          fail_on_error: false
        env:
          # Required, set by GitHub actions automatically:
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#about-the-github_token-secret
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # TEMPORARY probe for docs-tracking#375: compare the action's binary
      - name: probe the action's own vale binary
        if: always()
        run: |
          HOSTED=$(ls /opt/hostedtoolcache/vale/*/x64/vale | head -1)
          echo "--- hosted binary ---"; echo "$HOSTED"; $HOSTED --version
          echo "--- hosted: checks loaded ---"; $HOSTED ls-config 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print([c for c in d['Checks'] if c.startswith('Fly.')])" || true
          echo "--- hosted: direct run ---"; $HOSTED --no-exit --output=line litefs/how-it-works.mdx 2>&1 | head -3
          echo "--- mine for comparison ---"; /tmp/valebin/vale --version 2>/dev/null || curl -sL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz -o /tmp/v.tgz && mkdir -p /tmp/valebin && tar xzf /tmp/v.tgz -C /tmp/valebin && /tmp/valebin/vale --version
          echo "--- mine: checks loaded ---"; /tmp/valebin/vale ls-config 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print([c for c in d['Checks'] if c.startswith('Fly.')])" || true
          echo "--- sizes ---"; ls -l "$HOSTED" /tmp/valebin/vale
          echo "--- cwd hypothesis: run from /tmp with relative paths ---"
          (cd /tmp && $HOSTED --output=JSON litefs/how-it-works.mdx 2>&1 | head -c 120); echo
          echo "--- and with absolute paths from /tmp ---"
          (cd /tmp && $HOSTED --output=JSON "$GITHUB_WORKSPACE/litefs/how-it-works.mdx" 2>&1 | head -c 120); echo
          echo "--- exit marker ---"
