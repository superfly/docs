name: Check docs with Vale linter

on: [pull_request]

jobs:
  vale:
    name: Vale linter
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          # changed-files needs the commit where this branch split from main to
          # work out what the PR changed. A shallow checkout usually doesn't
          # reach it, so the step logged "Unable to find merge base" and fell
          # back to a cruder comparison. See docs-tracking#377.
          fetch-depth: 0

      - name: get changed files
        id: changed-files

        uses: tj-actions/changed-files@v46.0.5
        with:
          # Emit the list as a JSON array, which is the one shape vale-action
          # parses without a separator. escape_json defaults to true, which
          # backslash-escapes the quotes and makes the array unparseable.
          json: true
          escape_json: false

        # run reviewdog and the linter
      - name: run reviewdog and linter
        uses: errata-ai/vale-action@reviewdog
        with:
          # vale-action reads this input one of three ways: a single existing
          # path, a JSON array, or a string split on 'separator'. It trims
          # 'separator', so a space can't be passed that way, and an unparseable
          # value makes it lint the whole repo instead. A JSON array is the only
          # shape that reliably means "these files". See docs-tracking#375.
          #
          # all_changed_files is ACMR. The ACMRDTUX output includes deleted
          # paths, and Vale exits non-zero on a path that isn't there
          # ("argument 'x.mdx' does not exist"), which fail_on_error does not
          # cover because it isn't a lint finding.
          files: ${{ steps.changed-files.outputs.all_changed_files }}
          # added, diff_context, file, nofilter
          filter_mode: file
          # github-pr-check, github-pr-review, github-check
          reporter: github-pr-check
          fail_on_error: false
          # Pinned so a new Vale release can't change what the check does
          # without a PR. 3.24.0 is what "latest" resolved to on 22 Oct 2026.
          version: 3.24.0
          # .vale.ini lists no packages, so there is nothing to download.
          sync: false
        env:
          # Required, set by GitHub actions automatically:
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#about-the-github_token-secret
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
