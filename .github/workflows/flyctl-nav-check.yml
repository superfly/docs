name: Check flyctl pages are in the nav

on:
  pull_request:
    paths:
      - "flyctl/cmd/**"
      - "docs.json"
      - ".github/workflows/flyctl-nav-check.yml"

jobs:
  nav:
    name: flyctl nav check
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v4

      # The flyctl docs sync writes pages under flyctl/cmd/ but never touches
      # docs.json, so a new command gets published with no sidebar entry.
      # Fail the PR so whoever merges it adds the line. See docs-tracking#371.
      # Only the navigation block is read, so a redirect that mentions a page
      # can't stand in for its nav entry.
      #
      # The nav is read from current main as well as from this PR. A re-run
      # reuses the PR's original merge commit, so without this a nav entry
      # merged in a separate PR (the bot's branch can't take pushes) would
      # never turn the check green on re-run.
      - name: find flyctl pages with no nav entry
        run: |
          git fetch -q --depth=1 origin main
          nav=$( { jq '.navigation' docs.json; git show FETCH_HEAD:docs.json | jq '.navigation'; } \
            | grep -oE '"flyctl/cmd/[^"]+"' | tr -d '"' | sort -u)
          missing=$(comm -23 \
            <(ls flyctl/cmd/*.mdx | sed 's/\.mdx$//' | sort) \
            <(echo "$nav"))
          if [ -n "$missing" ]; then
            echo "These pages have no docs.json nav entry:"
            echo "$missing"
            exit 1
          fi
          echo "Every flyctl/cmd page is in the nav."

      # The reverse case: the sync deletes the page of a command removed from
      # flyctl, but its nav entry stays behind as a broken sidebar link.
      #
      # A re-run sees this PR's docs.json as of the original event, so a nav
      # fix merged separately wouldn't show. When this PR doesn't change
      # docs.json (the bot's never do), read the nav from current main instead.
      - name: find nav entries with no flyctl page
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin main:refs/remotes/origin/main "$BASE_SHA"
          src=HEAD
          if git diff --quiet "$BASE_SHA" HEAD -- docs.json; then src=origin/main; fi
          stale=$(comm -13 \
            <(ls flyctl/cmd/*.mdx | sed 's/\.mdx$//' | sort) \
            <(git show "$src:docs.json" | jq '.navigation' \
              | grep -oE '"flyctl/cmd/[^"]+"' | tr -d '"' | sort -u))
          if [ -n "$stale" ]; then
            echo "These docs.json nav entries have no page under flyctl/cmd/:"
            echo "$stale"
            exit 1
          fi
          echo "Every flyctl/cmd nav entry has a page."
